name: image
# Push a tag like datum-v1.0.1 to build the image (amd64 + arm64), publish it to ghcr.io,
# then copy the app folder into the store repo christhealien/blake2b (needs the STORE_TOKEN secret).
on:
  push:
    tags: ["datum-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version (e.g. 1.0.1)"
        required: true
permissions:
  contents: read
  packages: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT" = "workflow_dispatch" ]; then v="$INPUT_VERSION"; else v="${GITHUB_REF_NAME#datum-v}"; fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version: $v" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "upstream=$(cat UPSTREAM_TAG)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: datum-app
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            UPSTREAM_REF=${{ steps.v.outputs.upstream }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/blake2b-datum-gateway:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/blake2b-datum-gateway:latest
  store:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the store repo
        env:
          STORE_TOKEN: ${{ secrets.STORE_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          if [ -z "$STORE_TOKEN" ]; then echo "::notice::STORE_TOKEN is not set: copy the app folder into the store by hand (tools/publish_to_store.sh)"; exit 0; fi
          auth="$(printf 'x-access-token:%s' "$STORE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          if ! git -c "http.extraHeader=Authorization: Basic $auth" clone "https://github.com/$OWNER/blake2b.git" /tmp/store; then
            echo "::warning::Could not clone $OWNER/blake2b. Check that STORE_TOKEN is a token with Contents read+write on that repo. The store's own sync-apps workflow will still pick this release up."
            exit 0
          fi
          rm -rf /tmp/store/blake2b-datum-gateway
          cp -r blake2b-datum-gateway /tmp/store/
          cd /tmp/store
          git add -A
          git diff --cached --quiet && { echo "store already up to date"; exit 0; }
          git -c user.name=github-actions -c user.email=actions@users.noreply.github.com commit -m "blake2b-datum-gateway $VERSION"
          branch="$(git rev-parse --abbrev-ref HEAD)"
          if ! git -c "http.extraHeader=Authorization: Basic $auth" push origin "HEAD:$branch"; then
            echo "::warning::Push to $OWNER/blake2b was refused (token needs Contents: write). The store's sync-apps workflow will still pick this release up."
            exit 0
          fi
