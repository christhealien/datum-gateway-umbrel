manifestVersion: 1
id: blake2b-datum-gateway
name: DATUM Gateway (blake2b)
tagline: Mine with your own node and the DATUM protocol, with a redesigned dashboard
icon: https://raw.githubusercontent.com/christhealien/datum-gateway-umbrel/master/blake2b-datum-gateway/icon.svg?v=1.0.8
category: bitcoin
version: "1.0.8"
port: 8791
description: >-
  The DATUM Gateway from the Open Source DATUM project (OCEAN), running against your own Bitcoin
  node. Your miners connect to the Gateway over Stratum; the Gateway builds the block templates
  itself from your node and, if you choose, connects to a DATUM pool for decentralized pooled
  mining. Rewards are paid straight to the address you set.


  This build keeps the upstream gateway unchanged and replaces only its web pages with a cleaner
  dashboard: Status with a 24-hour hashrate graph, shares and the current stratum job; sortable,
  filterable Clients and Threads lists with reject rates and hashrate bars; the Coinbaser; and a
  Config page with the connection details for your miners, plus a restart button.


  Sign in with the username and password shown here (the same kind of login as Blake2b ASIC
  Control; change it under Account). One sign-in covers every page, including Config: no second
  prompt. A short setup page then asks for your reward address. Point miners at
  stratum+tcp://umbrel.local:23334. The Gateway is built from the newest upstream release.
developer: Open Source DATUM project (upstream); dashboard and packaging by christhealien
website: https://github.com/christhealien/datum-gateway-umbrel
dependencies:
  - bitcoin
repo: https://github.com/christhealien/datum-gateway-umbrel
support: https://github.com/christhealien/datum-gateway-umbrel/issues
submitter: christhealien
submission: https://github.com/christhealien/datum-gateway-umbrel
gallery:
  - https://raw.githubusercontent.com/christhealien/datum-gateway-umbrel/master/blake2b-datum-gateway/gallery/1.png?v=1.0.8
  - https://raw.githubusercontent.com/christhealien/datum-gateway-umbrel/master/blake2b-datum-gateway/gallery/2.png?v=1.0.8
  - https://raw.githubusercontent.com/christhealien/datum-gateway-umbrel/master/blake2b-datum-gateway/gallery/3.png?v=1.0.8
  - https://raw.githubusercontent.com/christhealien/datum-gateway-umbrel/master/blake2b-datum-gateway/gallery/4.png?v=1.0.8
  - https://raw.githubusercontent.com/christhealien/datum-gateway-umbrel/master/blake2b-datum-gateway/gallery/5.png?v=1.0.8
releaseNotes: |-
  **1.0.8**

  - Config: the Identity and advanced panel no longer sits under the floating Save bar, and Save and restart now confirms on the button and shows its result.

  **1.0.7**

  - Fix: the new Identity and advanced settings now save.

  **1.0.6**

  - Config page: the primary coinbase tag can now be changed any time, plus editable timeouts, log level and block-notify fallback (saving restarts the Gateway).

  **1.0.5**

  - Hashrate graph now has a memory: the app records it itself every 15 s (even with no tab open) and the graph remembers the 1 h / 6 h / 24 h range you picked. Refresh runs in the background, so the Auto refresh setting is gone. First sign-in with the login Umbrel shows now asks you to choose your own.

  **1.0.4**

  - CI: store step no longer fails the build

  **1.0.3**

  - Fixed: the Clients table jumped back to the left every refresh while you were scrolling it. Refresh now keeps your scroll position and waits while you hold the scrollbar or select text.

  **1.0.2**

  - Every difficulty now follows the Display setting (like DATUM, the miner's own, or both): network and block difficulty, minimum difficulty, shares and best share, on Status, Clients and Config.

  **1.0.1**

  - Fixed: after the first-run setup the page ended on a white 'Not found' page. It now continues to the dashboard by itself.

  **1.0.0: first release**

  - Redesigned dashboard (Status, Clients, Threads, Coinbaser, Config) with light and dark themes and a 24-hour hashrate graph.
  - One sign-in page like Blake2b ASIC Control: no second prompt on Config.
  - Per-client **Best Share** column, and a Display setting for share numbers (like DATUM, the miner's own, or both).
  - Choose the auto-refresh interval; restart the Gateway from Config or Status.
  - First-run setup page for the reward address; waits for your Bitcoin node (Knots or Core) to finish syncing.
  - Faster new-block detection (checks 4 times a second), so miners switch to a new block sooner.
  - Home-screen widget with connections and hashrate.
path: ""
deterministicPassword: true
defaultUsername: umbrel
widgets:
  - id: "gateway"
    type: "three-stats"
    refresh: "30s"
    endpoint: "web:7152/umbrel-api"
    link: ""
    example:
      type: "three-stats"
      link: ""
      items:
        - title: "Connections"
          text: "5"
          subtext: "Worker"
        - title: "Hashrate"
          text: "11.08"
          subtext: "TH/sec"
