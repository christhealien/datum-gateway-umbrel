name: upstream-sync
# Weekly: look for a new CONVOYMining/datum_gateway release, check the UI still fits it,
# bump the version and tag it (the tag triggers image.yml, which builds the image and refreshes the test store). Needs repo secret REPO_TOKEN
# (a Gitea access token with repository write): pushes made with the default token don't start workflows.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 0
      - name: Check upstream
        run: |
          set -eu
          git config user.name "upstream-sync"
          git config user.email "upstream-sync@localhost"
          out="$(python3 -I tools/sync_upstream.py)" || { echo "$out"; echo "::error::upstream release is not compatible with the UI, fix www/ by hand"; exit 1; }
          echo "$out"
          ver="$(echo "$out" | sed -n 's/^NEW_VERSION=//p')"
          [ -n "$ver" ] || exit 0
          git add -A
          git commit -m "Follow upstream $(cat UPSTREAM_TAG): app $ver"
          git tag "datum-v$ver"
          git push origin HEAD "datum-v$ver"
